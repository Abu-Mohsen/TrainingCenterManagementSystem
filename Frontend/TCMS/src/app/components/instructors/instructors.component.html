
<div class="container-fluid mt-5">

    <div class="card">
        <div class="card-header">
            <h5>
                <i class="bi bi-funnel"></i>
                 Filter
            </h5>
        </div>
        <div class="card-body">
          <div class="row mb-3" >
            <div class="col-lg-4 col-md-4 col-sm-12">
                <label for="instructorName"
                    class="form-label">Instructor Name</label>
                <input type="text" class="form-control"
                    id="instructorName"
                    placeholder="Enter Instructor Name">
            </div>

            <div class="col-lg-4 col-md-4 col-sm-12">
                <label for="ID"
                    class="form-label">ID</label>
                <input type="number" class="form-control"
                 id="ID"
                 placeholder="Enter ID">
            </div>

            <div class="col-lg-4 col-md-4 col-sm-12">
                <label for="Status"
                    class="form-label">Status</label>
                <input type="text" class="form-control"
                 id="Status"
                 placeholder="Enter Status">
            </div>
          </div>

            <div class="text-end">
                <button type="button" class="btn btn-outline-secondary">
                    <i class="bi bi-search"></i>
                    Search
                </button>
            </div>
        </div>
    </div>

    <div class="card mt-2">
        <div class="card-header table-header">

            <div>
                <h5> Instructors </h5>
            </div>

            <div>
                <button type="button" class="btn btn-outline-secondary">
                    <i class="bi bi-person-add"></i>
                    Add Instructor
                </button>
            </div>

        </div>
            
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col"></th>
                        <th scope="col"></th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <th scope="row">2</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <th scope="row">3</th>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
